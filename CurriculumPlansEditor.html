<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elkheta Curriculum Plan Builder</title>
    <style>
        :root {
            --elkheta-yellow: #facc15;
            --elkheta-dark: #1e293b;
            --elkheta-gray: #f1f5f9;
            --white: #ffffff;
            --danger: #ef4444;
            --edit: #3b82f6;
            --sidebar-width: 320px;
        }

        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; margin: 0; display: flex; color: #334155; height: 100vh; overflow: hidden; }
        
        /* Sidebar Navigation */
        #sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--elkheta-dark);
            color: white;
            position: fixed;
            left: 0; top: 0;
            display: flex;
            flex-direction: column;
            border-right: 4px solid var(--elkheta-yellow);
            z-index: 100;
        }

        .sidebar-header { padding: 25px; text-align: center; border-bottom: 1px solid #334155; }
        .sidebar-logo { width: 140px; margin-bottom: 15px; border-radius: 8px; }
        .sidebar-nav { flex-grow: 1; overflow-y: auto; padding: 15px; }
        
        .nav-item { 
            padding: 12px 15px; margin-bottom: 8px; background: #2d3748; border-radius: 6px; 
            cursor: pointer; transition: 0.2s; font-size: 13px;
            display: block; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
        }
        .nav-item:hover { background: var(--elkheta-yellow); color: var(--elkheta-dark); }

        .sidebar-footer { padding: 15px; display: flex; flex-direction: column; gap: 8px; background: #0f172a; }

        /* Main Content Workspace */
        .main-wrapper { margin-left: var(--sidebar-width); flex-grow: 1; padding: 30px; overflow-y: auto; height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; }

        .brand-header {
            background: var(--elkheta-dark);
            padding: 25px 40px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 30px;
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            margin-bottom: 40px;
            border-bottom: 6px solid var(--elkheta-yellow);
        }

        .header-text h1 { margin: 0; font-size: 1.8rem; letter-spacing: 1px; }
        .subject-badge {
            background: var(--elkheta-yellow); color: var(--elkheta-dark);
            padding: 6px 18px; border-radius: 8px; font-weight: 800;
            display: inline-block; margin-top: 10px; cursor: pointer; text-transform: uppercase; font-size: 13px;
        }

        /* Hierarchy Box Styling */
        .lecture-card { background: var(--white); border-radius: 15px; margin-bottom: 25px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .clickable-header { cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; transition: 0.2s; }
        .clickable-header:hover { background: rgba(0,0,0,0.02); }

        .lecture-header-box { background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        .topic-box { background: var(--elkheta-gray); border-left: 5px solid var(--elkheta-yellow); border-radius: 8px; margin: 15px 20px; border: 1px solid #cbd5e1; }
        .chapter-box { background: var(--white); border-radius: 8px; margin: 10px 20px; border: 1px dashed #94a3b8; }

        .collapsible-content { padding: 0 20px 20px 20px; }
        .collapsed { display: none !important; }

        /* Questions Display */
        .question-item { background: #fcfcfc; margin: 10px 0; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1; }
        .question-img { max-width: 100%; max-height: 300px; display: block; margin: 10px 0; border-radius: 8px; border: 1px solid #eee; }
        
        .q-tag { font-size: 0.7rem; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; font-weight: bold; margin-bottom: 5px; display: inline-block; }
        .tag-essay { background: #dbeafe; color: #1e40af; }
        .tag-mcq { background: #fef9c3; color: #854d0e; }

        .ans-box { margin-top: 10px; padding: 12px; background: #f0fdf4; border-radius: 8px; font-size: 0.9rem; border-left: 4px solid #22c55e; }
        .mcq-opt { font-size: 0.85rem; color: #64748b; padding: 2px 0; display: block;}
        .mcq-opt.correct { color: #16a34a; font-weight: bold; border-left: 3px solid #16a34a; padding-left: 5px; }

        /* Common Elements */
        .btn { cursor: pointer; border: none; border-radius: 6px; padding: 6px 12px; font-weight: 700; font-size: 11px; transition: 0.2s; text-transform: uppercase; }
        .btn-yellow { background: var(--elkheta-yellow); color: var(--elkheta-dark); }
        .btn-dark { background: var(--elkheta-dark); color: white; }
        .btn-danger { background: #fee2e2; color: #dc2626; }
        .btn-edit { background: #eff6ff; color: #2563eb; }
        .btn-image-dl { background: #10b981; color: white; padding: 4px 8px; font-size: 9px; margin-top: 5px; border-radius: 4px; }
        .btn-group { display: flex; gap: 8px; }

        /* Modal Engine */
        #modalOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 20px; width: 550px; max-width: 95%;
            max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-family: inherit;
        }

        .hidden { display: none; }
        .action-bar { display: flex; gap: 15px; margin: 30px 0; justify-content: center; padding-bottom: 50px; }
        .time-tag { color: var(--elkheta-dark); font-weight: bold; font-size: 0.75rem; background: var(--elkheta-yellow); padding: 2px 10px; border-radius: 20px; margin-left: 10px; }
    </style>
</head>
<body>

<aside id="sidebar">
    <div class="sidebar-header">
        <img src="file:///D:/DESIGN/17a64fa9-5b31-46c0-bc4d-85c32f66ec21-removebg-preview.png" alt="Logo" class="sidebar-logo">
        <div style="font-size: 14px; font-weight: bold; color: var(--elkheta-yellow); letter-spacing: 1px;">ELKHETA MENU</div>
    </div>
    <div class="sidebar-nav" id="sidebarNav"></div>
    <div class="sidebar-footer">
        <button class="btn btn-yellow" onclick="setGlobalSpread(true)">Expand All</button>
        <button class="btn btn-dark" onclick="setGlobalSpread(false)">Collapse All</button>
    </div>
</aside>

<div class="main-wrapper">
    <div class="container">
        <div class="brand-header">
            <div class="header-text">
                <h1>Elkheta Curriculum Plan</h1>
                <div class="subject-badge" onclick="editSubject()" id="subjectLabel">Mathematics</div>
            </div>
        </div>
        <div id="root"></div>
        <div class="action-bar">
            <button class="btn btn-yellow" style="padding: 15px 30px; font-size: 14px;" onclick="addLecture()">+ Create New Lecture</button>
            <button class="btn btn-dark" onclick="generateHTMLReport()">Generate Portable HTML</button>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="modalOverlay">
    <div class="modal-content">
        <h2 id="modalTitle" style="margin-top:0">Question Editor</h2>
        <div class="form-group">
            <label>Question Type</label>
            <select id="qTypeSelect" onchange="toggleQuestionFields()">
                <option value="essay">Essay Question</option>
                <option value="mcq">MCQ (Multiple Choice)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Question Text</label>
            <textarea id="qText" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>Attach Image (Optional)</label>
            <input type="file" id="qImg" accept="image/*">
        </div>
        <div id="essayFields">
            <div class="form-group"><label>Model Answer</label><textarea id="qAnswer" rows="4"></textarea></div>
        </div>
        <div id="mcqFields" class="hidden">
            <div class="form-group">
                <label>Choices</label>
                <input type="text" id="optA" placeholder="Option A" style="margin-bottom:5px">
                <input type="text" id="optB" placeholder="Option B" style="margin-bottom:5px">
                <input type="text" id="optC" placeholder="Option C" style="margin-bottom:5px">
                <input type="text" id="optD" placeholder="Option D">
            </div>
            <div class="form-group"><label>Correct Choice Letter (A, B, C, or D)</label><input type="text" id="optCorrect" maxlength="1"></div>
        </div>
        <div style="display:flex; gap:10px; justify-content: flex-end; margin-top: 20px;">
            <button class="btn btn-dark" onclick="closeModal()">Cancel</button>
            <button class="btn btn-yellow" onclick="handleSave()">Save Changes</button>
        </div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('elkheta_v16')) || { subject: "Mathematics", lectures: [] };
    let editingRef = { mode: null, lId: null, tId: null, cId: null, qId: null };

    function save() { localStorage.setItem('elkheta_v16', JSON.stringify(db)); render(); }

    /* --- Collapse/Expand --- */
    function toggleLec(id) { const item = db.lectures.find(l => l.id === id); item.collapsed = !item.collapsed; save(); }
    function toggleTop(lId, tId) { const item = db.lectures.find(l => l.id === lId).topics.find(t => t.id === tId); item.collapsed = !item.collapsed; save(); }
    function toggleChap(lId, tId, cId) { const item = db.lectures.find(l => l.id === lId).topics.find(t => t.id === tId).chapters.find(c => c.id === cId); item.collapsed = !item.collapsed; save(); }
    function setGlobalSpread(spread) { db.lectures.forEach(l => { l.collapsed = !spread; l.topics.forEach(t => { t.collapsed = !spread; t.chapters.forEach(c => c.collapsed = !spread); }); }); save(); }

    /* --- CRUD --- */
    function editSubject() { const s = prompt("Subject Name:", db.subject); if(s) { db.subject = s; save(); } }
    function addLecture() { const t = prompt("Lecture Title:"); if(t) { db.lectures.push({ id: Date.now(), title: t, topics: [], collapsed: false }); save(); } }
    function editLec(id) { const l = db.lectures.find(x => x.id === id); const t = prompt("Edit Title:", l.title); if(t) { l.title = t; save(); } }
    function addTopic(lId) { const t = prompt("Topic Title:"); if(t) { db.lectures.find(l => l.id === lId).topics.push({ id: Date.now(), title: t, chapters: [], collapsed: false }); save(); } }
    function editTopTitle(lId, tId) { const top = db.lectures.find(l => l.id === lId).topics.find(t => t.id === tId); const t = prompt("Edit Title:", top.title); if(t) { top.title = t; save(); } }
    function addChapter(lId, tId) { const title = prompt("Chapter Title:"); if(title) { db.lectures.find(l => l.id === lId).topics.find(t => t.id === tId).chapters.push({ id: Date.now(), title, start: "", end: "", questions: [], collapsed: false }); save(); } }
    function editChapTitle(lId, tId, cId) { const c = db.lectures.find(l => l.id === lId).topics.find(t => t.id === tId).chapters.find(x => x.id === cId); const t = prompt("Edit Title:", c.title); if(t) { c.title = t; save(); } }
    function setChapterTime(lId, tId, cId) { const c = db.lectures.find(l => l.id === lId).topics.find(t => t.id === tId).chapters.find(x => x.id === cId); const s = prompt("Start Time:", c.start); const e = prompt("End Time:", c.end); if(s!==null) c.start = s; if(e!==null) c.end = e; save(); }
    function deleteItem(type, lId, tId, cId, qId) { if(!confirm("Delete?")) return; if(type==='l') db.lectures = db.lectures.filter(x => x.id !== lId); if(type==='t') { const l = db.lectures.find(x => x.id === lId); l.topics = l.topics.filter(x => x.id !== tId); } if(type==='c') { const t = db.lectures.find(x => x.id === lId).topics.find(x => x.id === tId); t.chapters = t.chapters.filter(x => x.id !== cId); } if(type==='q') { const c = db.lectures.find(x => x.id === lId).topics.find(x => x.id === tId).chapters.find(x => x.id === cId); c.questions = c.questions.filter(x => x.id !== qId); } save(); }

    /* --- Image Download Engine --- */
    function downloadImage(data, name) {
        const a = document.createElement("a"); a.href = data; a.download = name || "question_image.png"; a.click();
    }

    /* --- Modal --- */
    function openModal(mode, lId, tId, cId, qId = null) {
        editingRef = { mode, lId, tId, cId, qId };
        document.getElementById('modalOverlay').style.display = 'flex';
        if (mode === 'edit') {
            const q = db.lectures.find(l => l.id === lId).topics.find(t => t.id === tId).chapters.find(c => c.id === cId).questions.find(qi => qi.id === qId);
            document.getElementById('qTypeSelect').value = q.type; document.getElementById('qText').value = q.q;
            if (q.type === 'essay') document.getElementById('qAnswer').value = q.a;
            else { document.getElementById('optA').value = q.options[0]; document.getElementById('optB').value = q.options[1]; document.getElementById('optC').value = q.options[2]; document.getElementById('optD').value = q.options[3]; document.getElementById('optCorrect').value = q.correct; }
        }
        toggleQuestionFields();
    }
    function toggleQuestionFields() { const type = document.getElementById('qTypeSelect').value; document.getElementById('essayFields').classList.toggle('hidden', type !== 'essay'); document.getElementById('mcqFields').classList.toggle('hidden', type !== 'mcq'); }
    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; ['qText', 'qImg', 'qAnswer', 'optA', 'optB', 'optC', 'optD', 'optCorrect'].forEach(id => document.getElementById(id).value = ''); }
    async function handleSave() {
        const type = document.getElementById('qTypeSelect').value; const text = document.getElementById('qText').value; const imgFile = document.getElementById('qImg').files[0];
        const chap = db.lectures.find(l => l.id === editingRef.lId).topics.find(t => t.id === editingRef.tId).chapters.find(c => c.id === editingRef.cId);
        let qData = (editingRef.mode === 'edit') ? chap.questions.find(q => q.id === editingRef.qId) : { id: Date.now(), type, q: text, img: "" };
        qData.type = type; qData.q = text; if (imgFile) qData.img = await toBase64(imgFile);
        if (type === 'essay') { qData.a = document.getElementById('qAnswer').value; delete qData.options; delete qData.correct; }
        else { qData.options = [document.getElementById('optA').value, document.getElementById('optB').value, document.getElementById('optC').value, document.getElementById('optD').value]; qData.correct = document.getElementById('optCorrect').value.toUpperCase(); delete qData.a; }
        if (editingRef.mode === 'add') chap.questions.push(qData); save(); closeModal();
    }
    const toBase64 = file => new Promise((r, j) => { const rd = new FileReader(); rd.readAsDataURL(file); rd.onload = () => r(rd.result); rd.onerror = e => j(e); });

    /* --- Portable HTML Export --- */
    function generateHTMLReport() {
        const styles = document.querySelector('style').innerHTML;
        const logo = "https://drive.google.com/uc?export=view&id=1DwWkrFdgnUKccoOqP9zjuk6cjHIQbXls";
        let bodyHTML = ""; let navHTML = "";
        
        db.lectures.forEach((l, i) => {
            const lectureTitle = `Lecture ${i+1}: ${l.title}`;
            navHTML += `<div class="nav-item" onclick="document.getElementById('lec-${l.id}').scrollIntoView({behavior:'smooth'})">${lectureTitle}</div>`;
            bodyHTML += `
            <div class="lecture-card" id="lec-${l.id}">
                <div class="clickable-header lecture-header-box" onclick="this.nextElementSibling.classList.toggle('collapsed')">
                    <h2>${lectureTitle}</h2>
                </div>
                <div class="collapsible-content">
                    ${l.topics.map(t => `
                        <div class="topic-box">
                            <div class="clickable-header" onclick="this.nextElementSibling.classList.toggle('collapsed')">
                                <h3>Topic: ${t.title}</h3>
                            </div>
                            <div class="collapsible-content">
                                ${t.chapters.map(c => `
                                    <div class="chapter-box">
                                        <div class="clickable-header" onclick="this.nextElementSibling.classList.toggle('collapsed')">
                                            <h4>${c.title} ${(c.start || c.end) ? `<span class="time-tag">⏱ ${c.start || '...'} - ${c.end || '...'}</span>` : ''}</h4>
                                        </div>
                                        <div class="collapsible-content">
                                            ${c.questions.map(q => `
                                                <div class="question-item">
                                                    <div><span class="q-tag ${q.type==='essay'?'tag-essay':'tag-mcq'}">${q.type.toUpperCase()}</span><div style="font-weight:bold">${q.q}</div></div>
                                                    ${q.img ? `<img src="${q.img}" class="question-img"><button class="btn btn-image-dl" onclick="const a=document.createElement('a');a.href='${q.img}';a.download='img.png';a.click();">Download Image</button>` : ''}
                                                    ${q.type === 'essay' ? `<div class="ans-box"><strong>Answer:</strong> ${q.a}</div>` : `
                                                        <div style="margin-top:10px">
                                                            <span class="mcq-opt ${q.correct === 'A' ? 'correct' : ''}">A) ${q.options[0]}</span><span class="mcq-opt ${q.correct === 'B' ? 'correct' : ''}">B) ${q.options[1]}</span>
                                                            <span class="mcq-opt ${q.correct === 'C' ? 'correct' : ''}">C) ${q.options[2]}</span><span class="mcq-opt ${q.correct === 'D' ? 'correct' : ''}">D) ${q.options[3]}</span>
                                                        </div>
                                                    `}
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>`;
        });
        
        const fullHTML = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Curriculum Export</title><style>${styles}.btn-group, .action-bar, .sidebar-footer, .btn-time, .btn-edit, .btn-danger, .btn-yellow, .btn-dark { display: none !important; }.main-wrapper { margin-left: 320px; padding: 20px; overflow-y:auto; }</style></head><body><aside id="sidebar"><div class="sidebar-header"><img src="${logo}" class="sidebar-logo"></div><div class="sidebar-nav">${navHTML}</div></aside><div class="main-wrapper"><div class="container"><div class="brand-header"><div class="header-text"><h1>Elkheta Curriculum</h1><div class="subject-badge">Subject: ${db.subject}</div></div></div>${bodyHTML}</div></div></body></html>`;
        const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([fullHTML], {type:'text/html'})); link.download = `Curriculum_${db.subject}.html`; link.click();
    }

    /* --- Dashboard Rendering --- */
    function render() {
        document.getElementById('subjectLabel').innerText = "Subject: " + db.subject;
        document.getElementById('sidebarNav').innerHTML = db.lectures.map((l, idx) => `<div class="nav-item" title="Lecture ${idx+1}: ${l.title}" onclick="document.getElementById('lec-${l.id}').scrollIntoView({behavior:'smooth'})">Lecture ${idx+1}: ${l.title}</div>`).join('');
        const root = document.getElementById('root'); root.innerHTML = '';
        db.lectures.forEach((lec, lIdx) => {
            const lDiv = document.createElement('div'); lDiv.className = 'lecture-card'; lDiv.id = 'lec-' + lec.id;
            lDiv.innerHTML = `
                <div class="clickable-header lecture-header-box"><div onclick="toggleLec(${lec.id})" style="flex-grow:1"><h2>Lecture ${lIdx+1}: ${lec.title} ${lec.collapsed ? '▼' : '▲'}</h2></div><div class="btn-group"><button class="btn btn-edit" onclick="editLec(${lec.id})">Edit</button><button class="btn btn-danger" onclick="deleteItem('l', ${lec.id})">Del</button></div></div>
                <div class="collapsible-content ${lec.collapsed ? 'collapsed' : ''}"><button class="btn btn-yellow" style="margin:10px 0 0 20px" onclick="addTopic(${lec.id})">+ Add Topic</button>
                ${lec.topics.map(t => `<div class="topic-box"><div class="clickable-header"><div onclick="toggleTop(${lec.id}, ${t.id})" style="flex-grow:1"><h3>Topic: ${t.title} ${t.collapsed ? '▼' : '▲'}</h3></div><div class="btn-group"><button class="btn btn-edit" onclick="editTopTitle(${lec.id}, ${t.id})">Edit</button><button class="btn btn-danger" onclick="deleteItem('t', ${lec.id}, ${t.id})">×</button></div></div>
                <div class="collapsible-content ${t.collapsed ? 'collapsed' : ''}"><button class="btn btn-dark" style="font-size:10px; margin-bottom:10px" onclick="addChapter(${lec.id}, ${t.id})">+ Add Chapter</button>
                ${t.chapters.map(c => `<div class="chapter-box"><div class="clickable-header"><div onclick="toggleChap(${lec.id}, ${t.id}, ${c.id})" style="flex-grow:1"><h4>${c.title} ${(c.start || c.end) ? `<span class="time-tag">⏱ ${c.start || '...'} - ${c.end || '...'}</span>` : ''} ${c.collapsed ? '▼' : '▲'}</h4></div><div class="btn-group"><button class="btn btn-edit" style="background:#cbd5e1; color:#1e293b" onclick="setChapterTime(${lec.id}, ${t.id}, ${c.id})">Time</button><button class="btn btn-edit" onclick="editChapTitle(${lec.id}, ${t.id}, ${c.id})">✎</button><button class="btn btn-danger" onclick="deleteItem('c', ${lec.id}, ${t.id}, ${c.id})">×</button></div></div>
                <div class="collapsible-content ${c.collapsed ? 'collapsed' : ''}"><button class="btn btn-yellow" style="font-size:9px" onclick="openModal('add', ${lec.id}, ${t.id}, ${c.id})">+ Add Question</button>
                ${c.questions.map(q => `
                    <div class="question-item">
                        <div style="display:flex; justify-content:space-between"><div><span class="q-tag ${q.type==='essay'?'tag-essay':'tag-mcq'}">${q.type.toUpperCase()}</span><div style="font-weight:bold">${q.q}</div></div><div class="btn-group"><button class="btn btn-edit" onclick="openModal('edit', ${lec.id}, ${t.id}, ${c.id}, ${q.id})">Edit</button><button class="btn btn-danger" onclick="deleteItem('q', ${lec.id}, ${t.id}, ${c.id}, ${q.id})">×</button></div></div>
                        ${q.img ? `<img src="${q.img}" class="question-img"><button class="btn btn-image-dl" onclick="downloadImage('${q.img}', 'q_image_${q.id}.png')">Download Image</button>` : ''}
                        ${q.type === 'essay' ? `<div class="ans-box"><strong>Model Answer:</strong> ${q.a}</div>` : `<div style="margin-top:10px"><span class="mcq-opt ${q.correct === 'A' ? 'correct' : ''}">A) ${q.options[0]}</span><span class="mcq-opt ${q.correct === 'B' ? 'correct' : ''}">B) ${q.options[1]}</span><span class="mcq-opt ${q.correct === 'C' ? 'correct' : ''}">C) ${q.options[2]}</span><span class="mcq-opt ${q.correct === 'D' ? 'correct' : ''}">D) ${q.options[3]}</span></div>`}
                    </div>`).join('')}</div></div>`).join('')}</div></div>`).join('')}</div>`;
            root.appendChild(lDiv);
        });
    }
    render();
</script>
</body>
</html>
