name: Deploy to GitHub Pages

# Builds the Vite app in elkheta-react/ and publishes it to GitHub Pages
# on every push to the default branch. The base path is derived from the
# repo name automatically, so this works no matter what you call the repo.

on:
  push:
    branches: [main]
  workflow_dispatch: {}      # lets you trigger a deploy manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elkheta-react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: elkheta-react/package-lock.json

      - run: npm ci

      - name: Build
        env:
          # → "/my-repo/". github.event.repository.name is the repo name.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: elkheta-react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
