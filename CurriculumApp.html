<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elkheta Curriculum Plan Builder</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --elkheta-yellow: #facc15;
            --elkheta-dark: #0f172a;
            --elkheta-gray: #1e2b42;
            --white: #182338;              /* card surface (dark) */
            --danger: #ef4444;
            --edit: #3b82f6;
            --sidebar-width: 320px;
            /* dark theme tokens */
            --bg: #0b1220;
            --panel: #141e30;
            --card: #182338;
            --card-2: #1e2b42;
            --border: #293751;
            --text: #e5ecf6;
            --muted: #93a4bd;
            --blue1: #2563eb;
            --blue2: #3b82f6;
        }

        * { -webkit-font-smoothing: antialiased; }
        button, input, select, textarea { font-family: 'Tajawal', 'Segoe UI', 'Tahoma', sans-serif; }
        body {
            font-family: 'Tajawal', 'Segoe UI', 'Tahoma', sans-serif; font-weight: 500; margin: 0; color: var(--text); height: 100vh; overflow: hidden;
            background: radial-gradient(1200px 600px at 12% -10%, #16233f 0%, transparent 55%),
                        radial-gradient(1000px 500px at 100% 0%, #241f10 0%, transparent 45%),
                        var(--bg);
        }

        /* ---------- App shell (hidden until logged in) ---------- */
        #appShell { display: none; height: 100vh; }
        #appShell.active { display: flex; }

        /* Sidebar Navigation */
        #sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--elkheta-dark);
            color: white;
            position: fixed;
            right: 0; top: 0;
            display: flex;
            flex-direction: column;
            border-left: 4px solid var(--elkheta-yellow);
            z-index: 100;
        }
        #sidebar { background: linear-gradient(180deg, #1e293b 0%, #172033 100%); }
        .sidebar-header { padding: 22px 20px; text-align: center; border-bottom: 1px solid #2b3648; }
        .sidebar-logo { width: 210px; max-width: 90%; display: block; margin: 2px auto; filter: drop-shadow(0 3px 8px rgba(0,0,0,0.45)); }
        .sidebar-nav { flex-grow: 1; overflow-y: auto; padding: 15px; }
        .nav-label { font-size: 11px; letter-spacing: 1px; color: #64748b; text-transform: uppercase; margin: 5px 5px 12px; font-weight: 700; }
        .nav-item {
            padding: 12px 14px; margin-bottom: 8px; background: #273449; border-radius: 10px;
            cursor: pointer; transition: 0.18s; font-size: 13px; border: 1px solid transparent;
            display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .nav-item:hover { background: var(--elkheta-yellow); color: var(--elkheta-dark); transform: translateX(-3px); }
        .nav-empty { color: #64748b; font-size: 12px; text-align: center; padding: 30px 10px; line-height: 1.7; }

        /* Section nav (top-level: curriculum / teams & users) */
        .section-nav { padding: 14px 15px 6px; border-bottom: 1px solid #2b3648; }
        .section-item {
            padding: 12px 14px; margin-bottom: 6px; border-radius: 10px; cursor: pointer; font-size: 13.5px;
            font-weight: 700; color: #cbd5e1; transition: 0.18s; display: flex; align-items: center; gap: 8px;
        }
        .section-item:hover { background: #273449; color: #fff; }
        .section-item.active { background: var(--elkheta-yellow); color: var(--elkheta-dark); }
        .sidebar-footer { padding: 15px; display: flex; flex-direction: column; gap: 8px; background: #0f172a; }

        /* User chip in sidebar */
        .user-chip { padding: 14px 15px; background: #0f172a; font-size: 12px; border-top: 1px solid #2b3648; }
        .user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .user-avatar {
            width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
            background: var(--elkheta-yellow); color: var(--elkheta-dark);
            display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px;
        }
        .user-meta { min-width: 0; }
        .user-chip .name { font-weight: bold; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .role-badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: var(--elkheta-yellow); color: var(--elkheta-dark); font-weight: bold; text-transform: uppercase; display: inline-block; margin-top: 3px; }
        .logout-btn {
            width: 100%; background: #331d1d; color: #fca5a5; text-transform: none;
            font-size: 12px; padding: 10px; border: 1px solid #4c2525; transition: 0.18s;
        }
        .logout-btn:hover { background: var(--danger); color: white; border-color: var(--danger); }

        /* Main Content Workspace */
        .main-wrapper { margin-right: var(--sidebar-width); flex-grow: 1; padding: 30px; overflow-y: auto; height: 100vh; box-sizing: border-box; }
        .container { max-width: 1000px; margin: 0 auto; }

        .brand-header {
            background: linear-gradient(120deg, #1e293b 0%, #223049 60%, #172033 100%);
            padding: 22px 35px; border-radius: 20px;
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
            color: white; box-shadow: 0 12px 30px rgba(15,23,42,0.25); margin-bottom: 22px;
            border-bottom: 6px solid var(--elkheta-yellow);
        }
        .header-text h1 { margin: 0; font-size: 1.55rem; letter-spacing: 0.5px; }
        .header-text .sub { font-size: 12px; color: #94a3b8; margin-top: 4px; }

        /* Color swatches (subject modal) */
        .color-swatches { display: flex; gap: 10px; flex-wrap: wrap; }
        .swatch { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; box-shadow: 0 1px 4px rgba(0,0,0,0.2); transition: 0.15s; }
        .swatch:hover { transform: scale(1.1); }
        .swatch.sel { border-color: #ffffff; }

        /* Hierarchy Box Styling */
        .lecture-card { background: var(--card); border-radius: 15px; margin-bottom: 25px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 6px 16px rgba(0,0,0,0.25); }
        .clickable-header { cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; transition: 0.2s; }
        .clickable-header:hover { background: rgba(255,255,255,0.03); }
        .lecture-header-box { background: var(--panel); border-bottom: 1px solid var(--border); }
        .topic-box { background: var(--card-2); border-right: 5px solid var(--elkheta-yellow); border-radius: 8px; margin: 15px 20px; border: 1px solid var(--border); }
        .chapter-box { background: var(--panel); border-radius: 8px; margin: 10px 20px; border: 1px dashed #3a4a67; }
        .collapsible-content { padding: 0 20px 20px 20px; }
        .collapsed { display: none !important; }

        /* Questions Display */
        .question-item { background: var(--card-2); margin: 10px 0; padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
        .question-img { max-width: 100%; max-height: 300px; display: block; margin: 10px 0; border-radius: 8px; border: 1px solid var(--border); }
        .q-tag { font-size: 0.7rem; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; font-weight: bold; margin-bottom: 5px; display: inline-block; }
        .tag-essay { background: #1e3a5f; color: #bfdbfe; }
        .tag-mcq { background: #4a3d0e; color: #fde68a; }
        .ans-box { margin-top: 10px; padding: 12px; background: rgba(34,197,94,0.12); border-radius: 8px; font-size: 0.9rem; border-right: 4px solid #22c55e; color: #d1fae5; }
        .mcq-opt { font-size: 0.85rem; color: var(--muted); padding: 2px 0; display: block; }
        .mcq-opt.correct { color: #4ade80; font-weight: bold; border-right: 3px solid #22c55e; padding-right: 5px; }

        /* Common Elements */
        .btn { cursor: pointer; border: none; border-radius: 6px; padding: 6px 12px; font-weight: 700; font-size: 11px; transition: 0.2s; text-transform: uppercase; }
        .btn-yellow { background: var(--elkheta-yellow); color: #1a1a1a; }
        .btn-dark { background: #334155; color: #e5ecf6; }
        .btn-danger { background: rgba(239,68,68,0.16); color: #fca5a5; }
        .btn-edit { background: rgba(59,130,246,0.16); color: #93c5fd; }
        .btn-image-dl { background: #10b981; color: white; padding: 4px 8px; font-size: 9px; margin-top: 5px; border-radius: 4px; }
        .btn-group { display: flex; gap: 8px; }

        /* Modal Engine */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2,6,15,0.75); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(3px);
        }
        .overlay.active { display: flex; }
        .modal-content {
            background: var(--card); color: var(--text); padding: 30px; border-radius: 20px; width: 550px; max-width: 95%;
            max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid var(--border);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: var(--text); }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-family: inherit;
            background: var(--panel); color: var(--text);
        }
        .hidden { display: none; }
        .action-bar { display: flex; gap: 15px; margin: 30px 0; justify-content: center; padding-bottom: 50px; flex-wrap: wrap; }
        .time-tag { color: #1a1a1a; font-weight: bold; font-size: 0.75rem; background: var(--elkheta-yellow); padding: 2px 10px; border-radius: 20px; margin-right: 10px; }

        /* Login screen */
        #loginScreen {
            position: fixed; inset: 0; z-index: 2000; background: var(--elkheta-dark);
            display: flex; justify-content: center; align-items: center;
        }
        .login-card { background: var(--card); padding: 40px; border-radius: 20px; width: 360px; max-width: 90%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border-top: 6px solid var(--elkheta-yellow); border-bottom: 1px solid var(--border); }
        .login-logo { width: 170px; display: block; margin: 0 auto 6px; background: #fff; border-radius: 12px; padding: 6px; }
        .login-card h2 { margin-top: 0; color: var(--text); font-size: 1.3rem; }
        .login-card input { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid var(--border); border-radius: 10px; box-sizing: border-box; background: var(--panel); color: var(--text); }
        .login-card a { color: var(--blue2); }
        .login-card input.invalid { border-color: var(--danger); background: rgba(239,68,68,0.06); }
        .login-card input.valid { border-color: #22c55e; }
        .field-err { color: #fca5a5; font-size: 11px; text-align: right; margin: -4px 4px 8px; min-height: 14px; line-height: 1.4; }
        /* global invalid highlight (any form field) */
        input.invalid, select.invalid, textarea.invalid { border-color: var(--danger) !important; background: rgba(239,68,68,0.10) !important; }
        .form-error { color: #fca5a5; font-size: 12px; font-weight: 700; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.4); padding: 8px 12px; border-radius: 8px; display: inline-block; }
        .rules-hint { color: var(--muted); font-size: 11px; text-align: right; margin: 0 4px 10px; line-height: 1.5; }
        .login-card .btn { width: 100%; padding: 14px; font-size: 14px; margin-top: 10px; }
        .login-msg { font-size: 13px; margin-top: 12px; min-height: 18px; }
        .login-msg.err { color: var(--danger); }
        .login-msg.ok  { color: #16a34a; }
        .muted { color: #94a3b8; font-size: 12px; }

        /* Users table */
        .users-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .users-table th, .users-table td { padding: 10px; border-bottom: 1px solid var(--border); text-align: right; }
        .users-table th { background: var(--panel); color: var(--muted); }
        .chk-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .chk-row label { font-weight: normal; font-size: 12px; background: var(--card-2); color: var(--text); padding: 4px 10px; border-radius: 6px; cursor: pointer; }
        .users-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 24px; box-shadow: 0 6px 16px rgba(0,0,0,0.25); }
        .add-user-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 20px; }
        .au-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .au-grid input, .au-grid select { padding: 10px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-family: inherit; width: 100%; background: var(--card-2); color: var(--text); }
        @media (max-width: 560px) { .au-grid { grid-template-columns: 1fr; } }

        .empty-state {
            text-align: center; padding: 55px 30px; margin-top: 10px;
            background: rgba(255,255,255,0.03); border: 1px dashed var(--border); border-radius: 20px;
        }
        .empty-icon {
            width: 78px; height: 78px; margin: 0 auto 18px; border-radius: 22px;
            display: flex; align-items: center; justify-content: center; font-size: 36px;
            background: linear-gradient(135deg, #3a3413, #4a3d0e); box-shadow: 0 10px 24px rgba(250,204,21,0.15);
        }
        .empty-title { font-size: 1.25rem; font-weight: 800; color: var(--text); margin-bottom: 8px; }
        .empty-sub { color: var(--muted); font-size: 0.95rem; line-height: 1.8; max-width: 420px; margin: 0 auto 20px; }

        /* ===== Subjects grid (cards) ===== */
        .subjects-toolbar { display: flex; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; align-items: center; }
        .search-box { flex: 1; min-width: 220px; position: relative; }
        .search-box input {
            width: 100%; padding: 12px 40px 12px 14px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--card); color: var(--text); box-sizing: border-box; font-family: inherit; font-size: 14px;
        }
        .search-box::before { content: "🔍"; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); opacity: .6; font-size: 13px; }
        .filter-select {
            padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--card); color: var(--text); font-family: inherit; font-size: 14px; cursor: pointer;
        }
        .subjects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
        .subject-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px;
            transition: 0.18s; display: flex; flex-direction: column;
        }
        .subject-card:hover { border-color: var(--elkheta-yellow); transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,0.3); }
        .sc-head { display: flex; align-items: flex-start; gap: 12px; }
        .sc-icon {
            width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            font-size: 20px; background: linear-gradient(135deg, #fde68a, var(--elkheta-yellow)); color: #1a1a1a;
        }
        .sc-title { font-weight: 800; font-size: 1.05rem; flex: 1; line-height: 1.4; word-break: break-word; }
        .sc-edit { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 4px; border-radius: 6px; transition: .15s; }
        .sc-edit:hover { color: var(--elkheta-yellow); background: rgba(255,255,255,0.05); }
        .sc-badges { display: flex; gap: 8px; margin: 12px 0 4px; flex-wrap: wrap; }
        .badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
        .badge-grade { background: rgba(168,85,247,0.18); color: #d8b4fe; }
        .badge-term  { background: rgba(34,197,94,0.16); color: #86efac; }
        .sc-lessons { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; margin-top: 8px; }
        .sc-divider { border-top: 1px solid var(--border); margin: 14px 0; }
        .btn-manage {
            width: 100%; border: none; cursor: pointer; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 13px;
            color: #fff; background: linear-gradient(135deg, var(--blue2), var(--blue1)); transition: .18s; font-family: inherit;
        }
        .btn-manage:hover { filter: brightness(1.1); box-shadow: 0 8px 20px rgba(37,99,235,0.35); }
        .subject-content-head {
            display: flex; align-items: center; gap: 14px; margin-bottom: 22px; background: var(--card);
            border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px;
        }
        .back-btn {
            background: var(--panel); border: 1px solid var(--border); color: var(--text); cursor: pointer;
            padding: 9px 16px; border-radius: 10px; font-weight: 700; font-size: 13px; font-family: inherit; transition: .15s;
        }
        .back-btn:hover { border-color: var(--elkheta-yellow); color: var(--elkheta-yellow); }
        .loader-dots { display:inline-flex; gap:6px; }
        .loader-dots span { width:9px; height:9px; border-radius:50%; background:var(--elkheta-yellow); animation: bounce 1s infinite; }
        .loader-dots span:nth-child(2){ animation-delay:.15s } .loader-dots span:nth-child(3){ animation-delay:.3s }
        @keyframes bounce { 0%,80%,100%{ transform:scale(.6); opacity:.4 } 40%{ transform:scale(1); opacity:1 } }
    </style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="loginScreen">
    <div class="login-card">
        <img src="new-logo.png" alt="Elkheta" class="login-logo">
        <h2>Elkheta Curriculum</h2>
        <p class="muted" id="authSubtitle">سجّل الدخول للمتابعة</p>
        <input type="text" id="loginName" placeholder="الاسم بالكامل" class="hidden" autocomplete="name" oninput="liveVal('name')" onblur="liveVal('name')">
        <div class="field-err hidden" id="errName"></div>

        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" autocomplete="username" oninput="liveVal('email')" onblur="liveVal('email')">
        <div class="field-err" id="errEmail"></div>

        <input type="password" id="loginPass" placeholder="كلمة المرور" autocomplete="current-password" oninput="liveVal('pass')" onblur="liveVal('pass')">
        <div class="field-err" id="errPass"></div>

        <input type="password" id="loginPass2" placeholder="تأكيد كلمة المرور" class="hidden" autocomplete="new-password" oninput="liveVal('pass2')" onblur="liveVal('pass2')">
        <div class="field-err hidden" id="errPass2"></div>

        <div class="rules-hint hidden" id="passRules">🔒 كلمة المرور: 8 أحرف على الأقل، وتحتوي على حروف وأرقام.</div>

        <button class="btn btn-yellow" id="authPrimaryBtn" onclick="submitAuth()">تسجيل الدخول</button>
        <div class="login-msg" id="loginMsg"></div>
        <div style="margin-top:14px; font-size:13px;">
            <a href="#" id="toggleAuthLink" onclick="toggleAuthMode(event)">ليس لديك حساب؟ أنشئ حسابًا</a>
        </div>
        <div style="margin-top:8px; font-size:12px;">
            <a href="#" class="muted" onclick="forgotPassword(event)">نسيت كلمة المرور؟</a>
        </div>
        <div class="muted" style="margin-top:15px" id="configWarn"></div>
    </div>
</div>

<!-- ============ APP ============ -->
<div id="appShell">
    <aside id="sidebar">
        <div class="sidebar-header">
            <img src="new-logo.png" alt="Elkheta" class="sidebar-logo">
            <div style="font-size: 11px; color: #64748b; margin-top: 6px; letter-spacing: 1px;">CURRICULUM BUILDER</div>
        </div>
        <div class="section-nav" id="sectionNav"></div>
        <div class="sidebar-nav" id="sidebarNav"></div>
        <div class="sidebar-footer">
            <button class="btn btn-yellow" onclick="setGlobalSpread(true)">فرد الكل</button>
            <button class="btn btn-dark" onclick="setGlobalSpread(false)">طي الكل</button>
        </div>
        <div class="user-chip" id="userChip"></div>
    </aside>

    <div class="main-wrapper">
        <div class="container">
            <div class="brand-header">
                <div class="header-text">
                    <h1 id="viewTitle">Elkheta Curriculum Plan</h1>
                    <div class="sub" id="viewSub">منصة بناء وإدارة المناهج الدراسية</div>
                </div>
            </div>

            <!-- ===== Curriculum view ===== -->
            <div id="curriculumView">
                <!-- Subjects grid (landing) -->
                <div id="subjectsView"></div>
                <!-- Selected subject content (lessons) -->
                <div id="subjectContentView" style="display:none">
                    <div id="subjectContentHead"></div>
                    <div id="root"></div>
                    <div class="action-bar" id="actionBar"></div>
                </div>
            </div>

            <!-- ===== Teams & Users view ===== -->
            <div id="usersView" style="display:none"></div>
        </div>
    </div>
</div>

<!-- ============ QUESTION MODAL ============ -->
<div id="modalOverlay" class="overlay">
    <div class="modal-content">
        <h2 id="modalTitle" style="margin-top:0">محرر السؤال</h2>
        <div class="form-group">
            <label>نوع السؤال</label>
            <select id="qTypeSelect" onchange="toggleQuestionFields()">
                <option value="essay">سؤال مقالي</option>
                <option value="mcq">اختيار من متعدد (MCQ)</option>
            </select>
        </div>
        <div class="form-group">
            <label>نص السؤال</label>
            <textarea id="qText" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>إرفاق صورة (اختياري)</label>
            <input type="file" id="qImg" accept="image/*">
            <div class="muted" id="qImgCurrent"></div>
        </div>
        <div id="essayFields">
            <div class="form-group"><label>الإجابة النموذجية</label><textarea id="qAnswer" rows="4"></textarea></div>
        </div>
        <div id="mcqFields" class="hidden">
            <div class="form-group">
                <label>الاختيارات</label>
                <input type="text" id="optA" placeholder="الاختيار A" style="margin-bottom:5px">
                <input type="text" id="optB" placeholder="الاختيار B" style="margin-bottom:5px">
                <input type="text" id="optC" placeholder="الاختيار C" style="margin-bottom:5px">

<!-- Supabase JS client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================================
   1) CONFIG  —  ⚠️ املأ الاتنين دول من Supabase → Settings → API
   ===================================================================== */
const SUPABASE_URL      = "https://cvcoqcfpqdndqohjiude.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_6y2RxSoqXf6LQd2QkSlepQ_V1uedc4l";

/* =====================================================================
   2) STATE
   ===================================================================== */
let sb = null;
let myProfile = null;          // { id, full_name, email, role }
let myAssignedIds = new Set(); // subject ids this editor can edit
let subjects = [];             // all subjects visible to me
let currentSubjectId = null;
let tree = [];                 // lectures->topics->chapters->questions for current subject
let editingRef = { mode: null, cId: null, qId: null, currentImg: "" };

/* =====================================================================
   3) HELPERS
   ===================================================================== */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const byPos = (a, b) => (a.position - b.position) || (a.created_at < b.created_at ? -1 : 1);

function roleLabel(r) {
    return { super_admin:"سوبر أدمن", admin:"أدمن", editor:"عضو فريق", viewer:"مشاهدة" }[r] || r;
}

// Can the current user edit the currently-selected subject?
function canEditCurrent() {
    if (!myProfile) return false;
    if (myProfile.role === 'super_admin' || myProfile.role === 'admin') return true;
    if (myProfile.role === 'editor') return myAssignedIds.has(currentSubjectId);
    return false;
}
// Can the current user create/delete subjects?
const isContentManager = () => myProfile && (myProfile.role === 'super_admin' || myProfile.role === 'admin');

function toast(msg) { console.log(msg); }
function fail(e, ctx) { console.error(ctx, e); alert((ctx ? ctx + ": " : "") + (e?.message || e)); }

/* =====================================================================
   4) AUTH
   ===================================================================== */
function initClient() {
    if (!SUPABASE_URL.startsWith("http") || SUPABASE_ANON_KEY.length < 20) {
        document.getElementById('configWarn').innerHTML =
            "⚠️ لسه محتاج تحط <b>SUPABASE_URL</b> و <b>ANON KEY</b> في أعلى الـ &lt;script&gt;.";
        return false;
    }
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    // Handle the return from a "reset password" email link.
    sb.auth.onAuthStateChange(async (event) => {
        if (event === 'PASSWORD_RECOVERY') {
            const newPass = prompt("اكتب كلمة المرور الجديدة (6 أحرف على الأقل):");
            if (newPass && newPass.length >= 6) {
                const { error } = await sb.auth.updateUser({ password: newPass });
                if (error) alert("خطأ: " + error.message);
                else { alert("تم تحديث كلمة المرور ✓"); location.reload(); }
            }
        }
    });
    return true;
}

let authMode = 'signin';  // 'signin' | 'signup'

function setMsg(text, kind) {
    const msg = document.getElementById('loginMsg');
    msg.className = "login-msg" + (kind ? " " + kind : "");
    msg.textContent = text;
}

function toggleAuthMode(ev) {
    if (ev) ev.preventDefault();
    authMode = authMode === 'signin' ? 'signup' : 'signin';
    const signup = authMode === 'signup';
    ['loginName', 'loginPass2', 'passRules', 'errName', 'errPass2'].forEach(id =>
        document.getElementById(id).classList.toggle('hidden', !signup));
    document.getElementById('authSubtitle').textContent = signup ? "أنشئ حسابًا جديدًا" : "سجّل الدخول للمتابعة";
    document.getElementById('authPrimaryBtn').textContent = signup ? "إنشاء حساب" : "تسجيل الدخول";
    document.getElementById('toggleAuthLink').textContent = signup ? "لديك حساب بالفعل؟ سجّل الدخول" : "ليس لديك حساب؟ أنشئ حسابًا";
    clearAuthErrors();
    setMsg("", "");
}

/* ---------- Validation rules (client-side) ---------- */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const vName  = v => !v.trim() ? "الاسم مطلوب" : (v.trim().length < 3 ? "الاسم قصير جدًا (3 أحرف على الأقل)" : "");
const vEmail = v => !v.trim() ? "البريد الإلكتروني مطلوب" : (!EMAIL_RE.test(v.trim()) ? "صيغة البريد الإلكتروني غير صحيحة" : "");
const vPass  = v => !v ? "كلمة المرور مطلوبة"
                    : v.length < 8 ? "كلمة المرور 8 أحرف على الأقل"
                    : !(/[A-Za-z؀-ۿ]/.test(v) && /[0-9]/.test(v)) ? "لازم تحتوي على حروف وأرقام"
                    : "";
const vPass2 = (v, p) => !v ? "أعد كتابة كلمة المرور" : (v !== p ? "كلمتا المرور غير متطابقتين" : "");

const _val = id => document.getElementById(id).value;
function showErr(errId, inputId, msg) {
    document.getElementById(errId).textContent = msg || "";
    const inp = document.getElementById(inputId);
    inp.classList.toggle('invalid', !!msg);
    inp.classList.toggle('valid', !msg && !!inp.value);
}
function clearAuthErrors() {
    ['errName', 'errEmail', 'errPass', 'errPass2'].forEach(id => document.getElementById(id).textContent = '');
    ['loginName', 'loginEmail', 'loginPass', 'loginPass2'].forEach(id => document.getElementById(id).classList.remove('invalid', 'valid'));
}
// Live per-field validation (called on input/blur)
function liveVal(field) {
    if (field === 'name')  showErr('errName', 'loginName', vName(_val('loginName')));
    if (field === 'email') showErr('errEmail', 'loginEmail', vEmail(_val('loginEmail')));
    if (field === 'pass') {
        showErr('errPass', 'loginPass', authMode === 'signup' ? vPass(_val('loginPass')) : (_val('loginPass') ? '' : 'كلمة المرور مطلوبة'));
        if (authMode === 'signup' && _val('loginPass2')) liveVal('pass2');
    }
    if (field === 'pass2') showErr('errPass2', 'loginPass2', vPass2(_val('loginPass2'), _val('loginPass')));
}

// Map Supabase (server-side) auth errors to friendly Arabic.
function mapAuthError(msg) {
    const m = (msg || '').toLowerCase();
    if (m.includes('invalid login')) return "البريد الإلكتروني أو كلمة المرور غير صحيحة";
    if (m.includes('email not confirmed')) return "لازم تأكيد البريد الإلكتروني أولًا";
    if (m.includes('already registered') || m.includes('already been registered') || m.includes('user already')) return "البريد الإلكتروني مسجّل بالفعل";
    if (m.includes('password')) return "كلمة المرور ضعيفة أو غير صالحة";
    if (m.includes('rate limit') || m.includes('too many')) return "محاولات كتير — استنى دقيقة وحاول تاني";
    if (m.includes('unable to validate email')) return "صيغة البريد الإلكتروني غير صحيحة";
    return msg;
}

function ensureClient() {
    if (!sb) { setMsg("⚠️ الموقع لسه مش متوصّل بـ Supabase — لازم تحط SUPABASE_URL و ANON KEY الأول.", "err"); return false; }
    return true;
}

function submitAuth() {
    if (!ensureClient()) return;
    authMode === 'signup' ? signUp() : signIn();
}

async function signIn() {
    const email = _val('loginEmail').trim(), password = _val('loginPass');
    // client-side validation
    const eEmail = vEmail(email), ePass = password ? '' : 'كلمة المرور مطلوبة';
    showErr('errEmail', 'loginEmail', eEmail); showErr('errPass', 'loginPass', ePass);
    if (eEmail || ePass) return setMsg("راجِع الحقول المميّزة بالأحمر", "err");

    setMsg("جارٍ الدخول…", "");
    const { error } = await sb.auth.signInWithPassword({ email, password });   // server-side check
    if (error) return setMsg("فشل الدخول: " + mapAuthError(error.message), "err");
    setMsg("تم ✓", "ok");
    await boot();
}

async function signUp() {
    const full_name = _val('loginName').trim(), email = _val('loginEmail').trim();
    const password = _val('loginPass'), password2 = _val('loginPass2');
    // client-side validation (all rules)
    const eName = vName(full_name), eEmail = vEmail(email), ePass = vPass(password), ePass2 = vPass2(password2, password);
    showErr('errName', 'loginName', eName); showErr('errEmail', 'loginEmail', eEmail);
    showErr('errPass', 'loginPass', ePass); showErr('errPass2', 'loginPass2', ePass2);
    if (eName || eEmail || ePass || ePass2) return setMsg("راجِع الحقول المميّزة بالأحمر", "err");

    setMsg("جارٍ إنشاء الحساب…", "");
    const { data, error } = await sb.auth.signUp({                            // server-side check (format, uniqueness, policy)
        email, password,
        options: { data: { full_name }, emailRedirectTo: window.location.href }
    });
    if (error) return setMsg("فشل الإنشاء: " + mapAuthError(error.message), "err");
    if (data.session) { setMsg("تم إنشاء الحساب ✓", "ok"); await boot(); }
    else setMsg("تم الإنشاء ✓ — راجع بريدك لتأكيد الحساب ثم سجّل الدخول.", "ok");
}

async function forgotPassword(ev) {
    if (ev) ev.preventDefault();
    if (!ensureClient()) return;
    const email = _val('loginEmail').trim();
    const eEmail = vEmail(email);
    showErr('errEmail', 'loginEmail', eEmail);
    if (eEmail) return setMsg("اكتب بريدًا صحيحًا أولًا ثم اضغط «نسيت كلمة المرور»", "err");
    setMsg("جارٍ إرسال رابط الاستعادة…", "");
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
    if (error) return setMsg("خطأ: " + mapAuthError(error.message), "err");
    setMsg("تم إرسال رابط استعادة كلمة المرور إلى بريدك ✓", "ok");
}

async function signOut() {
    await sb.auth.signOut();
    location.reload();
}

/* =====================================================================
   5) BOOT — load profile, subjects, assignments; then render
   ===================================================================== */
async function boot() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { showLogin(); return; }

    // my profile (role)
    const { data: prof, error: pe } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    if (pe) { fail(pe, "تحميل البروفايل"); return; }
    myProfile = prof;

    // my subject assignments (for editors)
    const { data: assigns } = await sb.from('user_subjects').select('subject_id').eq('user_id', session.user.id);
    myAssignedIds = new Set((assigns || []).map(a => a.subject_id));

    // subjects I can see
    const { data: subs, error: se } = await sb.from('subjects').select('*');
    if (se) { fail(se, "تحميل المواد"); return; }
    subjects = (subs || []).sort(byPos);
    await loadSubjectCounts();
    currentSubjectId = null;   // start on the subjects grid

    showApp();
    renderSectionNav();
    document.getElementById('userChip').innerHTML =
        `<div class="user-row">
            <div class="user-avatar">${esc((myProfile.full_name || myProfile.email || '؟').trim().charAt(0).toUpperCase())}</div>
            <div class="user-meta">
                <div class="name">${esc(myProfile.full_name || myProfile.email)}</div>
                <span class="role-badge">${roleLabel(myProfile.role)}</span>
            </div>
         </div>
         <button class="btn logout-btn" onclick="signOut()">↩ تسجيل الخروج</button>`;

    showView('curriculum');
}

// Count lessons (lectures) per subject for the cards.
let subjectCounts = {};
async function loadSubjectCounts() {
    subjectCounts = {};
    const { data } = await sb.from('lectures').select('subject_id');
    (data || []).forEach(l => { subjectCounts[l.subject_id] = (subjectCounts[l.subject_id] || 0) + 1; });
}

function showLogin() { document.getElementById('loginScreen').style.display = 'flex'; document.getElementById('appShell').classList.remove('active'); }
function showApp()   { document.getElementById('loginScreen').style.display = 'none';  document.getElementById('appShell').classList.add('active'); }

/* ---------- View switching (Curriculum  ⟷  Teams & Users) ---------- */
let currentView = 'curriculum';
function renderSectionNav() {
    const el = document.getElementById('sectionNav');
    const items = [{ id: 'curriculum', label: '📚 المناهج' }];
    if (myProfile && myProfile.role === 'super_admin') items.push({ id: 'users', label: '👥 Teams & Users' });
    el.innerHTML = items.map(it =>
        `<div class="section-item ${currentView === it.id ? 'active' : ''}" onclick="showView('${it.id}')">${it.label}</div>`
    ).join('');
}
function showView(v) {
    if (v === 'users' && (!myProfile || myProfile.role !== 'super_admin')) return;
    currentView = v;
    document.getElementById('curriculumView').style.display = v === 'curriculum' ? '' : 'none';
    document.getElementById('usersView').style.display = v === 'users' ? '' : 'none';
    document.getElementById('sidebarNav').style.display = (v === 'curriculum' && currentSubjectId) ? '' : 'none';
    renderSectionNav();
    if (v === 'users') { setHeader('Teams & Users', 'إدارة الفريق والصلاحيات'); renderUsersSection(); }
    else renderCurriculum();
}
function setHeader(title, sub) {
    document.getElementById('viewTitle').textContent = title;
    document.getElementById('viewSub').textContent = sub;
}
// Decide whether to show the subjects grid or a selected subject's lessons.
function renderCurriculum() {
    const grid = document.getElementById('subjectsView');
    const content = document.getElementById('subjectContentView');
    if (currentSubjectId) {
        grid.style.display = 'none'; content.style.display = '';
        document.getElementById('sidebarNav').style.display = '';
    } else {
        grid.style.display = ''; content.style.display = 'none';
        document.getElementById('sidebarNav').style.display = 'none';
        renderSubjectsGrid();
    }
}

/* =====================================================================
   6) SUBJECTS
   ===================================================================== */
function emptyState(icon, title, sub, cta = "") {
    return `<div class="empty-state">
        <div class="empty-icon">${icon}</div>
        <div class="empty-title">${title}</div>
        <div class="empty-sub">${sub}</div>
        ${cta}
    </div>`;
}

/* ---------- Subjects grid (cards) ---------- */
let subjSearch = '', subjGradeFilter = '', subjTermFilter = '';

function renderSubjectsGrid() {
    setHeader('Subjects', 'أدر موادك ودروسك');
    const view = document.getElementById('subjectsView');

    // toolbar (search + grade filter + term filter + add)
    const gradeOpts = `<option value="">كل السنوات</option>` +
        GRADES.map(g => `<option value="${g.code}" ${subjGradeFilter===g.code?'selected':''}>${GRADE_BADGE[g.code]}</option>`).join('');
    const termOpts = `<option value="">كل الترمات</option>` +
        TERMS.map(t => `<option value="${t.code}" ${subjTermFilter===t.code?'selected':''}>${t.label}</option>`).join('');
    const toolbar = `
        <div class="subjects-toolbar">
            <div class="search-box"><input type="text" id="subjSearchInput" placeholder="ابحث عن مادة..." value="${esc(subjSearch)}" oninput="onSubjSearch(this.value)"></div>
            <select class="filter-select" onchange="subjGradeFilter=this.value; renderSubjectsGrid()">${gradeOpts}</select>
            <select class="filter-select" onchange="subjTermFilter=this.value; renderSubjectsGrid()">${termOpts}</select>
            ${isContentManager() ? `<button class="btn btn-yellow" style="padding:12px 22px" onclick="openSubjectModal('add')">＋ مادة جديدة</button>` : ''}
        </div>`;

    // filter list
    let list = subjects.filter(s => {
        if (subjSearch && !(s.name || '').toLowerCase().includes(subjSearch.toLowerCase())) return false;
        if (subjGradeFilter && s.grade !== subjGradeFilter) return false;
        if (subjTermFilter && s.term !== subjTermFilter) return false;
        return true;
    });

    if (!subjects.length) {
        view.innerHTML = toolbar + (isContentManager()
            ? emptyState("✨", "لسه مفيش مواد", "ابدأ ببناء المنهج — أضف أول مادة دراسية.", `<button class="btn btn-yellow" style="padding:12px 26px" onclick="openSubjectModal('add')">+ أضف أول مادة</button>`)
            : emptyState("🔒", "لا توجد مواد متاحة لك", "لسه مفيش مواد متخصصة لحسابك. تواصل مع مسؤول النظام."));
        return;
    }
    if (!list.length) { view.innerHTML = toolbar + emptyState("🔎", "لا توجد نتائج", "غيّر كلمة البحث أو الفلاتر."); return; }

    const cards = list.map(s => {
        const editable = myProfile.role !== 'editor' || myAssignedIds.has(s.id);
        const count = subjectCounts[s.id] || 0;
        const gradeBadge = s.grade ? `<span class="badge badge-grade">${GRADE_BADGE[s.grade] || s.grade}</span>` : '';
        const termBadge = s.term ? `<span class="badge badge-term">${TERM_LABEL[s.term] || s.term}</span>` : '';
        const editBtn = editable ? `<button class="sc-edit" title="تعديل" onclick="event.stopPropagation(); openSubjectModal('edit','${s.id}')">✎</button>` : '';
        return `<div class="subject-card">
            <div class="sc-head">
                <div class="sc-icon" style="background:linear-gradient(135deg, ${esc(s.color||'#facc15')}, ${esc(s.color||'#facc15')}cc)">${editable ? '📘' : '🔒'}</div>
                <div class="sc-title">${esc(s.name)}</div>
                ${editBtn}
            </div>
            <div class="sc-badges">${gradeBadge}${termBadge}${!gradeBadge && !termBadge ? '<span class="badge badge-grade">بدون تصنيف</span>' : ''}</div>
            <div class="sc-lessons">🎓 ${count} محاضرة</div>
            <div class="sc-divider"></div>
            <button class="btn-manage" onclick="openSubjectContent('${s.id}')">${editable ? 'إدارة الدروس' : 'عرض الدروس'}</button>
        </div>`;
    }).join('');

    view.innerHTML = toolbar + `<div class="subjects-grid">${cards}</div>`;
}

function onSubjSearch(v) {
    subjSearch = v;
    // re-render but keep focus/caret in the search box
    renderSubjectsGrid();
    const inp = document.getElementById('subjSearchInput');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

async function openSubjectContent(id) {
    currentSubjectId = id;
    const s = subjects.find(x => x.id === id);
    setHeader(s?.name || 'المادة', [GRADE_BADGE[s?.grade] || '', TERM_LABEL[s?.term] || ''].filter(Boolean).join(' • ') || 'الدروس والأسئلة');
    document.getElementById('subjectsView').style.display = 'none';
    document.getElementById('subjectContentView').style.display = '';
    document.getElementById('sidebarNav').style.display = '';
    const canEdit = canEditCurrent();
    document.getElementById('subjectContentHead').innerHTML =
        `<button class="back-btn" onclick="backToSubjects()">→ كل المواد</button>
         <div style="flex:1"><div style="font-weight:800; font-size:1.1rem">${esc(s?.name || '')}</div></div>
         ${isContentManager() ? `<div class="btn-group"><button class="btn btn-edit" onclick="openSubjectModal('edit','${id}')">تعديل المادة</button><button class="btn btn-danger" onclick="deleteSubject()">حذف المادة</button></div>` : ''}`;
    await loadTree();
}

async function backToSubjects() {
    currentSubjectId = null;
    await loadSubjectCounts();      // refresh counts (may have changed)
    renderCurriculum();
}

];
let editingSubjectId = null;
let selectedSubjColor = '#facc15';

function fillSubjectNameSelect(current) {
    const list = [...SUBJECT_NAMES];
    if (current && !list.includes(current)) list.unshift(current);  // preserve an existing custom name
    document.getElementById('subjName').innerHTML =
        `<option value="">— اختر المادة —</option>` +
        list.map(n => `<option value="${esc(n)}" ${n === current ? 'selected' : ''}>${esc(n)}</option>`).join('');
}

function fillSubjectSelects(grade, term) {
    document.getElementById('subjGrade').innerHTML =
        `<option value="">— اختر السنة —</option>` +
        GRADES.map(x => `<option value="${x.code}" ${x.code === grade ? 'selected' : ''}>${x.code} — ${x.label}</option>`).join('');
    document.getElementById('subjTerm').innerHTML =
        `<option value="">— اختر الترم —</option>` +
        TERMS.map(x => `<option value="${x.code}" ${x.code === term ? 'selected' : ''}>${x.code} — ${x.label}</option>`).join('');
}

function openSubjectModal(mode, id = null) {
    editingSubjectId = mode === 'edit' ? id : null;
    const s = id ? subjects.find(x => x.id === id) : null;
    document.getElementById('subjectModalTitle').textContent = mode === 'edit' ? 'تعديل المادة' : 'مادة جديدة';
    fillSubjectNameSelect(s?.name || '');
    fillSubjectSelects(s?.grade || '', s?.term || '');
    selectedSubjColor = s?.color || '#facc15';
    renderSubjColors();
    document.getElementById('subjectOverlay').classList.add('active');
    setTimeout(() => document.getElementById('subjName').focus(), 50);
}
function renderSubjColors() {
    document.getElementById('subjColors').innerHTML = SUBJECT_COLORS.map(c =>
        `<span class="swatch ${c === selectedSubjColor ? 'sel' : ''}" style="background:${c}" onclick="selectSubjColor('${c}')"></span>`
    ).join('');
}
function selectSubjColor(c) { selectedSubjColor = c; renderSubjColors(); }
function closeSubjectModal() {
    document.getElementById('subjectOverlay').classList.remove('active');
    editingSubjectId = null;
}
async function saveSubject() {
    const name = document.getElementById('subjName').value.trim();
    if (!name) { alert("اسم المادة مطلوب"); return; }
    const grade = document.getElementById('subjGrade').value || null;
    const term  = document.getElementById('subjTerm').value || null;
    const btn = document.getElementById('subjSaveBtn'); btn.disabled = true; btn.textContent = "جارٍ الحفظ…";
    try {
        if (editingSubjectId) {
            const { error } = await sb.from('subjects').update({ name, color: selectedSubjColor, grade, term }).eq('id', editingSubjectId);
            if (error) throw error;
            const s = subjects.find(x => x.id === editingSubjectId);
            if (s) { s.name = name; s.color = selectedSubjColor; s.grade = grade; s.term = term; }
        } else {
            const { data, error } = await sb.from('subjects').insert({ name, color: selectedSubjColor, grade, term, position: subjects.length }).select().single();
            if (error) throw error;
            subjects.push(data); subjects.sort(byPos);
        }
        closeSubjectModal();
        // refresh whichever view is active
        if (currentSubjectId) { const s = subjects.find(x=>x.id===currentSubjectId); if (s) setHeader(s.name, [GRADE_BADGE[s.grade]||'', TERM_LABEL[s.term]||''].filter(Boolean).join(' • ')); }
        else renderSubjectsGrid();
    } catch (e) { fail(e, "حفظ المادة"); }
    finally { btn.disabled = false; btn.textContent = "حفظ"; }
}

async function deleteSubject() {
    if (!confirm("حذف المادة وكل محتواها؟")) return;
    const { error } = await sb.from('subjects').delete().eq('id', currentSubjectId);
    if (error) return fail(error, "حذف المادة");
    subjects = subjects.filter(s => s.id !== currentSubjectId);
    currentSubjectId = null;
    await loadSubjectCounts();
    renderCurriculum();
}

/* =====================================================================
   7) LOAD TREE for current subject
   ===================================================================== */
async function loadTree() {
    const root = document.getElementById('root');
    if (!currentSubjectId) { tree = []; render(); return; }
    root.innerHTML = `<div class="empty-state"><div class="empty-title" style="margin-bottom:16px">جارٍ التحميل</div><span class="loader-dots"><span></span><span></span><span></span></span></div>`;
    const { data, error } = await sb
        .from('lectures')
        .select('*, topics(*, chapters(*, questions(*)))')
        .eq('subject_id', currentSubjectId);
    if (error) { fail(error, "تحميل المحتوى"); return; }
    tree = (data || []).sort(byPos);
    tree.forEach(l => {
        l.topics = (l.topics || []).sort(byPos);
        l.topics.forEach(t => {
            t.chapters = (t.chapters || []).sort(byPos);
            t.chapters.forEach(c => { c.questions = (c.questions || []).sort(byPos); });
        });
    });
    render();
}

/* =====================================================================
   8) COLLAPSE (client-side only)
   ===================================================================== */
function toggleLec(id)  { const l = tree.find(x => x.id === id); l._c = !l._c; render(); }
function toggleTop(id)  { forEachNode(t => { if (t.id === id) t._c = !t._c; }, 'topic'); render(); }
function toggleChap(id) { forEachNode(c => { if (c.id === id) c._c = !c._c; }, 'chapter'); render(); }
function forEachNode(fn, level) {
    tree.forEach(l => l.topics.forEach(t => {
        if (level === 'topic') fn(t);
        t.chapters.forEach(c => { if (level === 'chapter') fn(c); });
    }));
}
function setGlobalSpread(spread) {
    tree.forEach(l => { l._c = !spread; l.topics.forEach(t => { t._c = !spread; t.chapters.forEach(c => c._c = !spread); }); });
    render();
}

/* =====================================================================
   9) CRUD  (all guarded by canEditCurrent + RLS on the server)
   ===================================================================== */
async function addLecture() {
    const title = prompt("عنوان المحاضرة:"); if (!title) return;
    const { error } = await sb.from('lectures').insert({ subject_id: currentSubjectId, title, position: tree.length });
    if (error) return fail(error, "إضافة محاضرة"); await loadTree();
}
async function editLec(id) {
    const l = tree.find(x => x.id === id); const title = prompt("تعديل العنوان:", l.title); if (!title) return;
    const { error } = await sb.from('lectures').update({ title }).eq('id', id);
    if (error) return fail(error, "تعديل"); await loadTree();
}
async function addTopic(lId) {
    const title = prompt("عنوان الموضوع:"); if (!title) return;
    const l = tree.find(x => x.id === lId);
    const { error } = await sb.from('topics').insert({ lecture_id: lId, title, position: l.topics.length });
    if (error) return fail(error, "إضافة موضوع"); await loadTree();
}
async function editTop(id, cur) {
    const title = prompt("تعديل العنوان:", cur); if (!title) return;
    const { error } = await sb.from('topics').update({ title }).eq('id', id);
    if (error) return fail(error, "تعديل"); await loadTree();
}
async function addChapter(tId, count) {
    const title = prompt("عنوان الفصل:"); if (!title) return;
    const { error } = await sb.from('chapters').insert({ topic_id: tId, title, position: count });
    if (error) return fail(error, "إضافة فصل"); await loadTree();
}
async function editChap(id, cur) {
    const title = prompt("تعديل العنوان:", cur); if (!title) return;
    const { error } = await sb.from('chapters').update({ title }).eq('id', id);
    if (error) return fail(error, "تعديل"); await loadTree();
}
async function setChapterTime(id, start, end) {
    const s = prompt("وقت البداية:", start ?? ""); if (s === null) return;
    const e = prompt("وقت النهاية:", end ?? ""); if (e === null) return;
    const { error } = await sb.from('chapters').update({ start_time: s, end_time: e }).eq('id', id);
    if (error) return fail(error, "تعديل الوقت"); await loadTree();
}
async function deleteItem(table, id) {
    if (!confirm("تأكيد الحذف؟")) return;
    const { error } = await sb.from(table).delete().eq('id', id);
    if (error) return fail(error, "حذف"); await loadTree();
}

/* =====================================================================
   10) QUESTION MODAL + image upload to Storage
   ===================================================================== */
function openModal(mode, cId, q = null) {
    editingRef = { mode, cId, qId: q?.id || null, currentImg: q?.img || "" };
    document.getElementById('modalOverlay').classList.add('active');
    document.getElementById('modalTitle').textContent = mode === 'edit' ? "تعديل السؤال" : "سؤال جديد";
    document.getElementById('qImgCurrent').textContent = q?.img ? "صورة مرفقة حاليًا ✓ (ارفع صورة جديدة للاستبدال)" : "";
    if (mode === 'edit' && q) {
        document.getElementById('qTypeSelect').value = q.type;
        document.getElementById('qText').value = q.q;
        if (q.type === 'essay') document.getElementById('qAnswer').value = q.a || "";
        else {
            const o = q.options || [];
            document.getElementById('optA').value = o[0] || "";
            document.getElementById('optB').value = o[1] || "";
            document.getElementById('optC').value = o[2] || "";
            document.getElementById('optD').value = o[3] || "";
            document.getElementById('optCorrect').value = q.correct || "";
        }
    }
    toggleQuestionFields();
}
function toggleQuestionFields() {
    const type = document.getElementById('qTypeSelect').value;
    document.getElementById('essayFields').classList.toggle('hidden', type !== 'essay');
    document.getElementById('mcqFields').classList.toggle('hidden', type !== 'mcq');
}
function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    ['qText','qImg','qAnswer','optA','optB','optC','optD','optCorrect'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('qImgCurrent').textContent = '';
}
async function uploadImage(file) {
    // unique-ish name without Math.random dependency
    const name = `${currentSubjectId}/${editingRef.cId}-${file.name}`.replace(/\s+/g, "_");
    const { error } = await sb.storage.from('question-images').upload(name, file, { upsert: true });
    if (error) throw error;
    return sb.storage.from('question-images').getPublicUrl(name).data.publicUrl;
}
async function handleSave() {
    const btn = document.getElementById('qSaveBtn'); btn.disabled = true; btn.textContent = "جارٍ الحفظ…";
    try {
        const type = document.getElementById('qTypeSelect').value;
        const text = document.getElementById('qText').value.trim();
        if (!text) { alert("نص السؤال مطلوب"); return; }
        const imgFile = document.getElementById('qImg').files[0];
        let img = editingRef.currentImg;
        if (imgFile) img = await uploadImage(imgFile);

        const payload = { type, q: text, img };
        if (type === 'essay') {
            payload.a = document.getElementById('qAnswer').value;
            payload.options = []; payload.correct = "";
        } else {
            payload.options = ['optA','optB','optC','optD'].map(id => document.getElementById(id).value);
            payload.correct = document.getElementById('optCorrect').value.toUpperCase();
            payload.a = "";
        }

        if (editingRef.mode === 'edit') {
            const { error } = await sb.from('questions').update(payload).eq('id', editingRef.qId);
            if (error) throw error;
        } else {
            const chap = findChapter(editingRef.cId);
            payload.chapter_id = editingRef.cId; payload.position = chap ? chap.questions.length : 0;
            const { error } = await sb.from('questions').insert(payload);
            if (error) throw error;
        }
        closeModal(); await loadTree();
    } catch (e) { fail(e, "حفظ السؤال"); }
    finally { btn.disabled = false; btn.textContent = "حفظ"; }
}
function findChapter(cId) {
    for (const l of tree) for (const t of l.topics) for (const c of t.chapters) if (c.id === cId) return c;
    return null;
}
function downloadImage(url) { const a = document.createElement("a"); a.href = url; a.download = "question_image"; a.target = "_blank"; a.click(); }

/* =====================================================================
   11) RENDER
   ===================================================================== */
function render() {
    const canEdit = canEditCurrent();
    const root = document.getElementById('root');
    const nav = document.getElementById('sidebarNav');

    nav.innerHTML = `<div class="nav-label">المحاضرات</div>` + (tree.length
        ? tree.map((l, i) => `<div class="nav-item" title="${esc(l.title)}" onclick="document.getElementById('lec-${l.id}').scrollIntoView({behavior:'smooth'})">محاضرة ${i+1}: ${esc(l.title)}</div>`).join('')
        : `<div class="nav-empty">لا توجد محاضرات بعد</div>`);

    // action bar
    const ab = document.getElementById('actionBar');
    ab.innerHTML = "";
    if (canEdit) ab.innerHTML += `<button class="btn btn-yellow" style="padding:15px 30px; font-size:14px;" onclick="addLecture()">+ محاضرة جديدة</button>`;
    ab.innerHTML += `<button class="btn btn-dark" onclick="generateHTMLReport()">تصدير HTML</button>`;

    if (!tree.length) {
        root.innerHTML = canEdit
            ? emptyState("📝", "المادة فاضية", "ابدأ ببناء المنهج — أضف أول محاضرة.", `<button class="btn btn-yellow" style="padding:12px 26px;font-size:13px" onclick="addLecture()">+ محاضرة جديدة</button>`)
            : emptyState("📭", "لا يوجد محتوى بعد", "لسه ماتضافش محتوى في المادة دي.");
        return;
    }

    // read-only helpers
    const editBtns = (edits) => canEdit ? `<div class="btn-group">${edits}</div>` : "";

    root.innerHTML = tree.map((lec, lIdx) => `
        <div class="lecture-card" id="lec-${lec.id}">
            <div class="clickable-header lecture-header-box">
                <div onclick="toggleLec('${lec.id}')" style="flex-grow:1"><h2>محاضرة ${lIdx+1}: ${esc(lec.title)} ${lec._c ? '▼' : '▲'}</h2></div>
                ${editBtns(`<button class="btn btn-edit" onclick="editLec('${lec.id}')">تعديل</button>
                            <button class="btn btn-danger" onclick="deleteItem('lectures','${lec.id}')">حذف</button>`)}
            </div>
            <div class="collapsible-content ${lec._c ? 'collapsed' : ''}">
                ${canEdit ? `<button class="btn btn-yellow" style="margin:10px 0 0" onclick="addTopic('${lec.id}')">+ موضوع</button>` : ''}
                ${lec.topics.map(t => `
                    <div class="topic-box">
                        <div class="clickable-header">
                            <div onclick="toggleTop('${t.id}')" style="flex-grow:1"><h3>موضوع: ${esc(t.title)} ${t._c ? '▼' : '▲'}</h3></div>
                            ${editBtns(`<button class="btn btn-edit" onclick="editTop('${t.id}', '${esc(t.title).replace(/'/g,"\\'")}')">تعديل</button>
                                        <button class="btn btn-danger" onclick="deleteItem('topics','${t.id}')">×</button>`)}
                        </div>
                        <div class="collapsible-content ${t._c ? 'collapsed' : ''}">
                            ${canEdit ? `<button class="btn btn-dark" style="font-size:10px; margin-bottom:10px" onclick="addChapter('${t.id}', ${t.chapters.length})">+ فصل</button>` : ''}
                            ${t.chapters.map(c => `
                                <div class="chapter-box">
                                    <div class="clickable-header">
                                        <div onclick="toggleChap('${c.id}')" style="flex-grow:1"><h4>${esc(c.title)} ${(c.start_time || c.end_time) ? `<span class="time-tag">⏱ ${esc(c.start_time || '...')} - ${esc(c.end_time || '...')}</span>` : ''} ${c._c ? '▼' : '▲'}</h4></div>
                                        ${editBtns(`<button class="btn btn-edit" style="background:#cbd5e1; color:#1e293b" onclick="setChapterTime('${c.id}', '${esc(c.start_time||'')}', '${esc(c.end_time||'')}')">الوقت</button>
                                                    <button class="btn btn-edit" onclick="editChap('${c.id}', '${esc(c.title).replace(/'/g,"\\'")}')">✎</button>
                                                    <button class="btn btn-danger" onclick="deleteItem('chapters','${c.id}')">×</button>`)}
                                    </div>
                                    <div class="collapsible-content ${c._c ? 'collapsed' : ''}">
                                        ${canEdit ? `<button class="btn btn-yellow" style="font-size:9px" onclick="openModalById('${c.id}')">+ سؤال</button>` : ''}
                                        ${c.questions.map(q => renderQuestion(q, c.id, canEdit)).join('')}
                                    </div>
                                </div>`).join('')}
                        </div>
                    </div>`).join('')}
            </div>
        </div>`).join('');
}

function renderQuestion(q, cId, canEdit) {
    const opts = q.options || [];
    const body = q.type === 'essay'
        ? `<div class="ans-box"><strong>الإجابة النموذجية:</strong> ${esc(q.a)}</div>`
        : `<div style="margin-top:10px">
                <span class="mcq-opt ${q.correct==='A'?'correct':''}">A) ${esc(opts[0])}</span>
                <span class="mcq-opt ${q.correct==='B'?'correct':''}">B) ${esc(opts[1])}</span>
                <span class="mcq-opt ${q.correct==='C'?'correct':''}">C) ${esc(opts[2])}</span>
                <span class="mcq-opt ${q.correct==='D'?'correct':''}">D) ${esc(opts[3])}</span>
           </div>`;
    const editBtns = canEdit
        ? `<div class="btn-group">
              <button class="btn btn-edit" onclick="openModalEdit('${cId}','${q.id}')">تعديل</button>
              <button class="btn btn-danger" onclick="deleteItem('questions','${q.id}')">×</button>
           </div>` : "";
    return `<div class="question-item">
        <div style="display:flex; justify-content:space-between">
            <div><span class="q-tag ${q.type==='essay'?'tag-essay':'tag-mcq'}">${q.type.toUpperCase()}</span><div style="font-weight:bold">${esc(q.q)}</div></div>
            ${editBtns}
        </div>
        ${q.img ? `<img src="${esc(q.img)}" class="question-img"><button class="btn btn-image-dl" onclick="downloadImage('${esc(q.img)}')">تحميل الصورة</button>` : ''}
        ${body}
    </div>`;
}
function openModalById(cId) { openModal('add', cId); }
function openModalEdit(cId, qId) {
    const chap = findChapter(cId);
    const q = chap && chap.questions.find(x => x.id === qId);
    if (q) openModal('edit', cId, q);
}

                <select id="nuRole" onchange="document.getElementById('nuSubs').style.display = this.value==='editor' ? 'flex' : 'none'">
                    <option value="viewer">مشاهدة</option>
                    <option value="editor">عضو فريق</option>
                    <option value="admin">أدمن</option>
                    <option value="super_admin">سوبر أدمن</option>
                </select>
            </div>
            <div id="nuSubs" class="chk-row" style="display:none; margin-top:10px">${newSubjChecks}</div>
            <div style="display:flex; align-items:center; gap:12px; margin-top:12px">
                <button class="btn btn-dark" id="nuBtn" onclick="createUser()">إنشاء الحساب</button>
                <span id="nuMsg" class="muted"></span>
            </div>
        </div>
    </div>

    <table class="users-table"><thead><tr><th>الاسم</th><th>الإيميل</th><th>الدور</th><th>المواد المخصصة</th><th></th></tr></thead><tbody>
        ${(users||[]).sort((a,b)=> (a.email||'').localeCompare(b.email||'')).map(u => {
            const mine = assignMap[u.id] || new Set();
            const roleSel = `<select onchange="changeRole('${u.id}', this.value)">
                ${['super_admin','admin','editor','viewer'].map(r => `<option value="${r}" ${u.role===r?'selected':''}>${roleLabel(r)}</option>`).join('')}
            </select>`;
            const subsChk = u.role === 'editor'
                ? `<div class="chk-row">${subList.map(s => `<label><input type="checkbox" ${mine.has(s.id)?'checked':''} onchange="toggleAssign('${u.id}','${s.id}',this.checked)"> ${esc(s.name)}</label>`).join('') || '<span class="muted">لا مواد</span>'}</div>`
                : `<span class="muted">— (الدور ده بيشوف الكل)</span>`;
            const delCell = (u.id === myProfile.id)
                ? `<span class="muted" title="حسابك الحالي">أنت</span>`
                : `<button class="btn btn-danger" title="حذف اليوزر" onclick="deleteUser('${u.id}', '${esc(u.email||'').replace(/'/g,'&#39;')}')">🗑 حذف</button>`;
            return `<tr><td>${esc(u.full_name||'')}</td><td>${esc(u.email||'')}</td><td>${roleSel}</td><td>${subsChk}</td><td>${delCell}</td></tr>`;
        }).join('')}
    </tbody></table>
    </div>`;
}
function toggleAddUser() {
    document.getElementById('addUserForm').classList.toggle('hidden');
}
async function createUser() {
    const nameEl = document.getElementById('nuName');
    const emailEl = document.getElementById('nuEmail');
    const passEl = document.getElementById('nuPass');
    const full_name = nameEl.value.trim(), email = emailEl.value.trim(), password = passEl.value;
    const role = document.getElementById('nuRole').value;
    const subject_ids = [...document.querySelectorAll('.newUserSubj:checked')].map(c => c.value);
    const msg = document.getElementById('nuMsg');

    // per-field client-side validation: highlight the wrong field + point to it
    const fieldName = { nuName: 'الاسم', nuEmail: 'البريد الإلكتروني', nuPass: 'كلمة المرور' };
    const checks = [{ el: nameEl, err: vName(full_name) }, { el: emailEl, err: vEmail(email) }, { el: passEl, err: vPass(password) }];
    checks.forEach(c => c.el.classList.toggle('invalid', !!c.err));
    const bad = checks.find(c => c.err);
    if (bad) {
        msg.className = 'form-error';
        msg.textContent = `⚠️ ${fieldName[bad.el.id]}: ${bad.err}`;
        bad.el.focus();
        return;
    }

    const btn = document.getElementById('nuBtn'); btn.disabled = true;
    msg.className = 'muted'; msg.textContent = "جارٍ الإنشاء…";
    try {
        const { data, error } = await sb.functions.invoke('create-user', { body: { email, password, full_name, role, subject_ids } });
        if (error) throw error;
        if (data?.error) { msg.className = 'form-error'; msg.textContent = "⚠️ " + data.error; return; }
        renderUsersSection();  // refresh list + reset form
    } catch (e) {
        msg.className = 'form-error';
        msg.textContent = "⚠️ فشل الإنشاء: " + (e?.message || e) + " — اتأكد إن الـ Edge Function متعملها Deploy.";
    } finally { btn.disabled = false; }
}

async function changeRole(userId, role) {
    const { error } = await sb.from('profiles').update({ role }).eq('id', userId);
    if (error) return fail(error, "تغيير الدور");
    renderUsersSection();
}

async function deleteUser(userId, email) {
    if (!confirm(`تأكيد حذف اليوزر:\n${email}\n\n⚠️ ده هيحذف حسابه وكل صلاحياته نهائيًا ومش هينفع تراجع فيه.`)) return;
    try {
        const { data, error } = await sb.functions.invoke('create-user', { body: { action: 'delete', user_id: userId } });
        if (error) throw error;
        if (data?.error) return alert("خطأ: " + data.error);
        renderUsersSection();
    } catch (e) {
        alert("فشل الحذف: " + (e?.message || e) + " — اتأكد إنك عملت Re-deploy للـ Edge Function بالنسخة الجديدة.");
    }
}
async function toggleAssign(userId, subjectId, on) {
    if (on) {
        const { error } = await sb.from('user_subjects').insert({ user_id: userId, subject_id: subjectId });
        if (error) return fail(error, "إضافة تخصيص");
    } else {
        const { error } = await sb.from('user_subjects').delete().eq('user_id', userId).eq('subject_id', subjectId);
        if (error) return fail(error, "إزالة تخصيص");
    }
}

/* =====================================================================
   14) START
   ===================================================================== */
(async function start() {
    if (!initClient()) { showLogin(); return; }
    await boot();
})();
</script>
